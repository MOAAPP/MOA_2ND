name: One-time cleanup of fully merged branches
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-merged-branches-once.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete fully merged non-main branches only
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const branches = await github.paginate(github.rest.repos.listBranches, { owner, repo, per_page: 100 });
            for (const branch of branches) {
              if (branch.name === 'main' || branch.protected) continue;
              const comparison = await github.rest.repos.compareCommits({
                owner, repo, base: 'main', head: branch.name
              });
              if (comparison.data.ahead_by !== 0) {
                core.info('Kept unmerged work: ' + branch.name + ' (' + comparison.data.ahead_by + ' unique commits)');
                continue;
              }
              try {
                await github.rest.git.deleteRef({owner, repo, ref: 'heads/' + branch.name});
                core.info('Deleted fully merged branch: ' + branch.name);
              } catch (error) {
                core.warning('Could not delete ' + branch.name + ': ' + error.message);
              }
            }
