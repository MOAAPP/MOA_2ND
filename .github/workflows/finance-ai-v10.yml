name: Finance AI v10 quality and benchmark
on:
  pull_request:
    branches: [main]
    paths:
      - 'shared/aiPrompts.ts'
      - 'server/lib/ai.ts'
      - 'moa-app/src/**'
      - 'scripts/build-moa-app.sh'
      - 'scripts/eval/finance-ai-live.ts'
      - 'tests/aiQualityV10.test.ts'
      - '.github/workflows/finance-ai-v10.yml'
  workflow_dispatch:
    inputs:
      benchmark_url:
        description: 'Optional HTTPS staging URL for 8 synthetic LLM calls'
        required: false
        type: string
permissions:
  contents: read

jobs:
  offline-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Check TypeScript
        run: npm run typecheck
      - name: Test AI schemas, grounded output, polite style and retries
        run: |
          mkdir -p reports
          npx vitest run tests/aiQualityV10.test.ts tests/ai.test.ts tests/aiSchemas.test.ts --reporter=json --outputFile=reports/ai-v10-unit.json
      - name: Ensure released mobile app and Node AI API can build
        run: bash scripts/build-moa-app.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finance-ai-v10-offline-evidence
          path: reports/ai-v10-unit.json
          if-no-files-found: ignore

  optional-staging-benchmark:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.benchmark_url != '' }}
    needs: offline-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Benchmark synthetic finance coaching on staging
        env:
          MOA_AI_BENCH_URL: ${{ inputs.benchmark_url }}
        run: npx tsx scripts/eval/finance-ai-live.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finance-ai-v10-live-benchmark
          path: reports/finance-ai-live.json
          if-no-files-found: ignore
