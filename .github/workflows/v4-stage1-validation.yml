name: V4 Stage 1 validation

on:
  push:
    branches:
      - feature/v4-finance-fastapi-stage1-20261104
  pull_request:
    paths:
      - 'backend/**'
      - 'src/components/FinanceEnginePanel.tsx'
      - 'src/lib/financeApi.ts'
      - 'src/screens/V8Finance.tsx'
      - 'vite.config.ts'
      - '.github/workflows/v4-stage1-validation.yml'

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FastAPI and testing dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Test finance engine against committed source dataset
        run: cd backend && python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm test