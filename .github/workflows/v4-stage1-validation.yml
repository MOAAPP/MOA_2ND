name: V4 React frontend verification
on:
  push:
    branches: [main, feature/v4-finance-fastapi-stage1-20261104]
  pull_request:
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: npm test
