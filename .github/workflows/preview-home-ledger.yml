name: Preview MOA personalized learning home and ledger browser QA
on:
  push:
    branches: [preview/ledger-world-home-half-ring-20261114]
    paths:
      - 'releases/MOA_learning_daily_cards_preview_20261114.zip'
      - 'scripts/qa-preview-ledger-world.cjs'
      - '.github/workflows/preview-home-ledger.yml'
      - 'vercel.json'
  pull_request:
    paths:
      - 'releases/MOA_learning_daily_cards_preview_20261114.zip'
      - 'scripts/qa-preview-ledger-world.cjs'
      - '.github/workflows/preview-home-ledger.yml'
      - 'vercel.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract exactly the preview-deployed source
        run: |
          unzip -q releases/MOA_learning_daily_cards_preview_20261114.zip -d .
          sed -i 's/ES2020/ES2022/g' moa-web/tsconfig.json
      - name: Install frontend and Chromium
        working-directory: moa-web
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Typecheck and build
        working-directory: moa-web
        run: npm run build
      - name: Verify finance calculations, learning UI, and routes
        working-directory: moa-web
        run: npm run qa:all
      - name: Start development server
        working-directory: moa-web
        run: |
          nohup npm run dev -- --host 127.0.0.1 > /tmp/moa-preview-vite.log 2>&1 &
      - name: Mobile end-to-end smoke
        run: node scripts/qa-preview-ledger-world.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moa-preview-learning-home-screenshots
          path: preview-evidence/
          if-no-files-found: warn
