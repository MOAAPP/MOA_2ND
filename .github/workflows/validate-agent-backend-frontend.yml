name: Validate MOA frontend demo and six-world backend wiring

on:
  push:
    branches:
      - feat/world-agent-frontend-integration
    paths:
      - 'scripts/patch-agent-backend.mjs'
      - 'scripts/patch-demo-finance.mjs'
      - 'scripts/patch-world-backend.mjs'
      - 'scripts/patch-world-six-safety.mjs'
      - 'scripts/patch-savings-backend.mjs'
      - 'integration/savingsPlan.ts'
      - 'tests/savings-plan.test.mjs'
      - 'integration/demoFinance.ts'
      - 'integration/demoFinanceMap.ts'
      - 'integration/worldComparison.ts'
      - 'integration/worldSixSafety.ts'
      - 'tests/demo-finance-map.test.mjs'
      - 'tests/world-comparison.test.mjs'
      - 'tests/world-six-safety.test.mjs'
      - 'scripts/build-latest-ui.sh'
      - 'releases/MOA_home_dashboard_ai_20261115.zip'
      - '.github/workflows/validate-agent-backend-frontend.yml'
  pull_request:
    paths:
      - 'scripts/patch-agent-backend.mjs'
      - 'scripts/patch-demo-finance.mjs'
      - 'scripts/patch-world-backend.mjs'
      - 'scripts/patch-world-six-safety.mjs'
      - 'scripts/patch-savings-backend.mjs'
      - 'integration/savingsPlan.ts'
      - 'tests/savings-plan.test.mjs'
      - 'integration/demoFinance.ts'
      - 'integration/demoFinanceMap.ts'
      - 'integration/worldComparison.ts'
      - 'integration/worldSixSafety.ts'
      - 'tests/demo-finance-map.test.mjs'
      - 'tests/world-comparison.test.mjs'
      - 'tests/world-six-safety.test.mjs'
      - 'scripts/build-latest-ui.sh'
      - 'releases/MOA_home_dashboard_ai_20261115.zip'
      - '.github/workflows/validate-agent-backend-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployed-frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate demo, six worlds and backend savings plan mapping
        run: |
          node --experimental-strip-types --test \
            tests/demo-finance-map.test.mjs \
            tests/world-comparison.test.mjs \
            tests/world-six-safety.test.mjs \
            tests/savings-plan.test.mjs
      - name: Extract and patch the actual production ZIP
        shell: bash
        run: |
          unzip -q releases/MOA_home_dashboard_ai_20261115.zip -d .
          node scripts/patch-agent-backend.mjs
          node scripts/patch-demo-finance.mjs
          node scripts/patch-world-backend.mjs
          node scripts/patch-world-six-safety.mjs
          node scripts/patch-savings-backend.mjs
          ! grep -q 'import snapshot from' moa-web/src/pages/Agent.tsx
          grep -q 'max_evaluations: 72' moa-web/src/lib/api.ts
          grep -q 'getSixWorldSafety' moa-web/src/lib/bridge.js
          grep -q 'getSavingsPlan' moa-web/src/pages/Savings.tsx
          # All patches must be repeatable in the ZIP deployment pipeline.
          node scripts/patch-agent-backend.mjs
          node scripts/patch-demo-finance.mjs
          node scripts/patch-world-backend.mjs
          node scripts/patch-world-six-safety.mjs
          node scripts/patch-savings-backend.mjs
          # Assert ALL CSS and the original 3D templates stay byte-identical.
          unzip -Z1 releases/MOA_home_dashboard_ai_20261115.zip | grep '\.css$' | while IFS= read -r file; do
            unzip -p releases/MOA_home_dashboard_ai_20261115.zip "$file" | cmp - "$file"
          done
          for file in moa-web/src/screens/World.jsx moa-web/src/screens/World.controller.js moa-web/src/pages/WorldRecords.tsx; do
            unzip -p releases/MOA_home_dashboard_ai_20261115.zip "$file" | cmp - "$file"
          done
          # Savings markup styling, controls, and 3D planet stay unchanged.
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const file = 'moa-web/src/pages/Savings.tsx';
          const original = execFileSync('unzip', ['-p', 'releases/MOA_home_dashboard_ai_20261115.zip', file], { encoding: 'utf8' });
          const updated = readFileSync(file, 'utf8');
          const classes = s => [...s.matchAll(/className=(?:"[^"]*"|\{`[^`]*`\})/g)].map(m => m[0]);
          assert.deepEqual(classes(updated), classes(original), 'Savings classes changed');
          for (const marker of ['<PlanetGrowthScene ', '<BottomSheet open={!!sheet}', '<PrimaryButton onClick={join}', '<PageHeader title="가상 예·적금"']) {
            assert(original.includes(marker) && updated.includes(marker), marker + ' markup changed');
          }
          NODE
          sed -i 's/ES2020/ES2022/g' moa-web/tsconfig.json
      - name: Install dependencies
        working-directory: moa-web
        run: npm ci
      - name: Typecheck and build deployed frontend
        working-directory: moa-web
        run: npm run build
      # Existing ZIP's qa:logic/qa:render runner cannot import store.ts.
      - name: Frontend navigation static smoke test
        working-directory: moa-web
        run: npm run qa:routes
