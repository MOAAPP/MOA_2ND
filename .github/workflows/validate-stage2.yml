name: V4 stage2 React integration checks
on:
  pull_request:
    paths:
      - 'src/**'
      - 'package*.json'
      - 'vite.config.ts'
      - '.github/workflows/validate-stage2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: npm ci
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Vite build
        run: npm run build
      - name: React and integration tests
        run: npm test
