name: Live FastAPI to frontend integration (no deploy)
on:
  push:
    branches: [feat/world-agent-frontend-integration]
    paths:
      - 'tests/live-api-contract.test.mjs'
      - 'integration/**'
      - '.github/workflows/live-fastapi-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-fastapi-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout UI integration branch
        uses: actions/checkout@v4
      - name: Checkout real FastAPI personal-input branch
        uses: actions/checkout@v4
        with:
          repository: MOAAPP/MOA_2ND_BE
          ref: feat/personal-input-integration
          path: backend
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real backend
        run: python -m pip install -r backend/requirements.txt
      - name: Start FastAPI from checked-out backend branch
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD/backend" python -m uvicorn app.main:app --host 127.0.0.1 --port 8137 >/tmp/moa-fastapi.log 2>&1 &
          echo $! >/tmp/moa-fastapi.pid
          ready=0
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:8137/api/v4/health >/tmp/moa-health.json 2>/dev/null; then ready=1; break; fi
            if ! kill -0 "$(cat /tmp/moa-fastapi.pid)" 2>/dev/null; then break; fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then cat /tmp/moa-fastapi.log; exit 1; fi
          cat /tmp/moa-health.json
      - name: Exercise live HTTP and map exact frontend contracts
        env:
          MOA_TEST_API_ORIGIN: http://127.0.0.1:8137
        run: node --experimental-strip-types --test tests/live-api-contract.test.mjs
      - name: Debug FastAPI if any test fails
        if: failure()
        run: tail -n 120 /tmp/moa-fastapi.log || true
