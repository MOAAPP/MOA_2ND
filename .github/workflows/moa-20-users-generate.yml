name: Generate MOA 20-user synthetic dataset

on:
  push:
    branches:
      - main
      - feat/shared-92-day-dataset-20-users
      - feat/s01-complex-showcase
      - fix/daily-five-spends-unified-s01-ledger
      - fix/demo-filled-from-first-setup
      - fix/onboarding-example-first-entry
      - feat/home-ux-flow-unified-demo-clock
    paths:
      - .github/workflows/moa-20-users-generate.yml
      - scripts/data/build-moa-dataset.mjs
      - scripts/data/enrich-s01-showcase.mjs
      - scripts/data/normalize-daily-ledger.mjs
      - tests/sharedDataset.test.ts
      - tests/s01Showcase.test.ts
      - tests/daily5Unified.test.ts
      - src/screens/Ledger.tsx
      - src/lib/worldWallet.ts
      - src/lib/worldHistory.ts
      - src/lib/demoSeed.ts
      - src/screens/moa/MoaSetup.tsx
      - src/ux-moa.css
      - tests/demoFirstSetup.test.ts
      - tests/demoSetupMarkup.test.ts
      - src/state/store.tsx
      - src/App.tsx
      - src/screens/Onboarding.tsx
      - src/screens/V8Finance.tsx
      - src/screens/Choose.tsx
      - src/ux-v19.css
      - tests/onboardingEntry.test.ts
      - tests/homeUxAndDemoClock.test.ts
      - tests/homeLayoutUx.test.tsx
      - vite.config.ts
      - src/screens/ParallelLab.tsx
      - src/screens/NewChoice.tsx
      - src/screens/bank/SaveHome.tsx
      - src/screens/moa/MoaSetup.tsx
      - docs/UX_HOME_V22.md
      - src/lib/appClock.ts
      - src/lib/decisionSave.ts
      - src/lib/bank/sync.ts
      - src/state/moa.tsx
      - src/state/bank.tsx
      - src/state/nav.tsx
      - src/screens/moa/parts.tsx
      - src/screens/moa/Shortfall.tsx
      - src/screens/WorldTimeline.tsx
      - src/screens/WorldReport.tsx
      - src/main.tsx
      - src/ux-v22-home.css
      - src/screens/Settings.tsx
      - src/lib/ai/context.ts
      - src/lib/demo.ts
      - src/lib/worldHistory.ts
      - src/lib/moa/bridge.ts
      - src/lib/demoWorld.ts
      - docs/data/S01_SHOWCASE_DEMO.md
      - docs/data/MOA_92D_GUIDE.md

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build deterministic JSON and CSV
        run: node scripts/data/build-moa-dataset.mjs
      - name: Validate users, days and data invariants
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const d = JSON.parse(readFileSync('public/data/moa-92days.json', 'utf8'));
          if (d.profiles.length !== 20 || d.daily.length !== 1840) throw new Error('Expected 20 profiles x 92 days');
          if (new Set(d.profiles.map(p => p.user_id)).size !== 20) throw new Error('Duplicate user profiles');
          if (new Set(d.daily.map(x => x.user_id + ':' + x.date)).size !== 1840) throw new Error('Duplicate user/day');
          for (const date of d.daily) {
            if (date.future_scenario && (date.model_label !== null || date.observation_complete)) {
              throw new Error('Future data leaked into observations');
            }
          }
          for (const p of d.profiles) {
            const prev = d.daily.find(x => x.user_id === p.user_id && x.date === '2026-10-26');
            const next = d.daily.find(x => x.user_id === p.user_id && x.date === '2026-10-27');
            if (!prev || !next || next.account_balance_eod !== prev.account_balance_eod + next.income_in - next.account_out + next.emergency_transfer_in) {
              throw new Error('Invalid carry-forward balance: ' + p.user_id);
            }
          }
          for (const day of d.daily) {
            const expenses = d.transactions.filter(x => x.user_id === day.user_id &&
              x.date === day.date && x.kind === 'spend' && !x.essential);
            const visible = expenses.filter(x => x.logged);
            if (expenses.length < 5 || (day.date <= d.metadata.snapshot_date && visible.length < 5))
              throw new Error('Daily minimum five failed: ' + day.user_id + ' ' + day.date);
          }
          console.log('Validated 20 users x 92 days with five daily spends');
          NODE
      - name: Run S01 demo and shared dataset tests
        run: |
          npm ci
          npm test
          npm run build
      - name: Create shareable team ZIP
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root = Path('public/data')
          paths = [root / 'moa-92days.json', *sorted(root.glob('moa-92days-*.csv'))]
          paths.append(Path('docs/data/MOA_92D_GUIDE.md'))
          paths.append(Path('docs/data/S01_SHOWCASE_DEMO.md'))
          with ZipFile(root / 'moa-92days-20users-team.zip', 'w', compression=ZIP_DEFLATED, compresslevel=9) as archive:
              for path in paths:
                  archive.write(path, arcname=path.name)
          PY
      - name: Commit generated fixtures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/moa-92days.json public/data/moa-92days-*.csv public/data/moa-92days-20users-team.zip src/data/moa-demo-s01.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): generate 20-user 92-day synthetic fixtures"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
