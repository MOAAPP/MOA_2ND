name: Inspect actual deploy UI (temporary)
on:
  push:
    branches: [feat/ux-journey-review-20261117]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read scenario and agent composition
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('releases/MOA_home_dashboard_ai_20261115.zip') as z:
            for name,start,end in [('moa-web/src/pages/WorldChoice.tsx',40,192),('moa-web/src/pages/Agent.tsx',70,175),('moa-web/src/screens/Home.css',75,190),('moa-web/src/pages/Agent.css',40,125)]:
              print('\\n==== '+name+' ====')
              for i,s in enumerate(z.read(name).decode().splitlines(),1):
                if start<=i<=end: print(f'{i:03}: {s[:700]}')
          PY
