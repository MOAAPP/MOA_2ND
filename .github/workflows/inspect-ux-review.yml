name: Inspect actual deploy UI (temporary)
on:
  push:
    branches: [feat/ux-journey-review-20261117]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read shipped home and styles
        run: |
          python3 - <<'PY'
          import zipfile,re
          with zipfile.ZipFile('releases/MOA_home_dashboard_ai_20261115.zip') as z:
            names=z.namelist()
            for pattern in ['src/screens/Home.jsx','src/screens/Home.css','src/pages/Agent.css','src/screens/World.css','src/pages/Lab.css','src/styles/index.css']:
              found=[n for n in names if n.endswith(pattern)]
              if not found: continue
              s=z.read(found[0]).decode()
              print('\\n===== '+pattern+' '+str(len(s))+' =====')
              for i,line in enumerate(s.splitlines(),1):
                if pattern.endswith('.css'):
                  if re.search(r'(^|[ }])(?:\\.[a-zA-Z_-]|body|main|header|button|:root|\\[)',line):
                    print(f'{i:03d}: {line[:250]}')
                  if i>=550: break
                elif i<=18 or re.search('<main|<section|<article|<header|<h[1-4]|<button|data-briefing|data-nav=|className=|<p |<span ',line):
                  print(f'{i:03d}: {line[:290]}')
                  if i>=440: break
          PY
